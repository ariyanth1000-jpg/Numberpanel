<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>ANU LIVE NUMBER PANEL</title>

<style>

:root{
  --bg:#070A13;
  --bg2:#0B1530;
  --border:rgba(255,255,255,.14);
  --text:#EEF3FF;
  --muted:#A7B3D1;

  --blue1:#4F8CFF;
  --blue2:#2563EB;

  --green1:#22c55e;
  --green2:#16a34a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:linear-gradient(
    135deg,
    var(--bg),
    var(--bg2)
  );

  font-family:sans-serif;
  color:var(--text);

  display:flex;
  justify-content:center;

  padding:10px;
}

.card{
  width:100%;
  max-width:520px;

  background:rgba(255,255,255,.08);

  border-radius:18px;

  padding:14px;

  box-shadow:0 0 25px #2563eb;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:12px;

  gap:10px;
}

.title{
  font-size:18px;
  font-weight:900;
}

.sub{
  color:var(--muted);
  font-size:11px;
}

.badge{
  border:1px solid var(--border);

  border-radius:999px;

  padding:5px 10px;

  font-size:10px;

  white-space:nowrap;
}

.panel{
  background:rgba(0,0,0,.25);

  border:1px solid var(--border);

  border-radius:16px;

  padding:12px;
}

/* RANGE */

.servicesWrap{

  overflow-x:auto;
  overflow-y:hidden;

  margin-bottom:12px;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;

  scroll-behavior:smooth;
}

.servicesWrap::-webkit-scrollbar{
  display:none;
}

.services{
  display:flex;
  gap:8px;
  width:max-content;
}

/* DEFAULT */

.service{

  border-radius:12px;

  padding:8px 12px;

  white-space:nowrap;

  font-weight:900;

  cursor:pointer;

  font-size:12px;

  transition:.18s ease;

  user-select:none;

  border:1px solid rgba(255,255,255,.08);

  background:#111827;

  color:#fff;
}

/* GREEN */

.service.hasNumbers{

  background:linear-gradient(
    135deg,
    var(--green1),
    var(--green2)
  );

  animation:glow .9s infinite;
}

/* ACTIVE BLUE */

.service.active{

  background:linear-gradient(
    135deg,
    var(--blue1),
    var(--blue2)
  ) !important;

  animation:none !important;

  box-shadow:none !important;
}

@keyframes glow{

  0%{
    box-shadow:0 0 0px #22c55e;
  }

  50%{
    box-shadow:0 0 14px #22c55e;
  }

  100%{
    box-shadow:0 0 0px #22c55e;
  }

}

/* INFO */

.info{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-bottom:12px;
}

.box{
  border:1px solid var(--border);

  border-radius:12px;

  padding:10px;
}

.label{
  color:var(--muted);
  font-size:10px;
}

.value{
  font-size:20px;
  font-weight:900;
}

/* BUTTON */

.getBtn{

  width:100%;

  border:none;

  border-radius:14px;

  padding:14px;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

  color:#fff;

  margin-bottom:12px;

  background:linear-gradient(
    135deg,
    var(--blue1),
    var(--blue2)
  );
}

/* LIVE */

.live{
  display:grid;
  gap:8px;
}

.nbox{

  border:1px solid var(--border);

  border-radius:12px;

  padding:10px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  min-height:52px;

  background:rgba(255,255,255,.03);

  gap:8px;
}

.num{
  font-size:14px;
  font-weight:900;

  word-break:break-all;

  flex:1;
}

.copyBtn{

  border:none;

  color:#fff;

  border-radius:8px;

  padding:6px 10px;

  cursor:pointer;

  font-weight:900;

  font-size:11px;

  flex-shrink:0;

  background:linear-gradient(
    135deg,
    var(--green1),
    var(--green2)
  );
}

/* OTP */

.otpBtn{

  width:100%;

  margin-top:12px;

  border:none;

  border-radius:14px;

  padding:13px;

  font-size:14px;

  font-weight:900;

  cursor:pointer;

  color:#fff;

  background:linear-gradient(
    135deg,
    #7c3aed,
    #9333ea
  );
}

/* HISTORY */

.historyTitle{

  margin-top:14px;

  margin-bottom:8px;

  text-align:center;

  font-weight:900;

  font-size:14px;
}

.history{
  display:grid;
  gap:8px;
}

.hbox{

  border:1px solid var(--border);

  border-radius:12px;

  padding:10px;

  background:rgba(255,255,255,.03);

  display:flex;

  justify-content:space-between;

  align-items:center;

  min-height:52px;

  gap:8px;
}

.hnum{

  font-weight:900;

  font-size:13px;

  word-break:break-all;

  flex:1;
}

.hrange{

  font-size:10px;

  color:var(--muted);

  flex-shrink:0;
}

/* TOAST */

.toast{

  position:fixed;

  top:12px;

  left:50%;

  transform:translateX(-50%);

  background:rgba(0,0,0,.78);

  border:1px solid var(--border);

  border-radius:10px;

  padding:8px 12px;

  opacity:0;

  transition:.18s;

  font-weight:900;

  z-index:999;

  font-size:12px;
}

.toast.show{
  opacity:1;
}

/* MOBILE */

@media(max-width:480px){

  .title{
    font-size:15px;
  }

  .value{
    font-size:17px;
  }

  .num{
    font-size:12px;
  }

  .hnum{
    font-size:11px;
  }

  .copyBtn{
    font-size:10px;
    padding:5px 8px;
  }

}

</style>
</head>
<body>

<div class="toast"
id="toast"></div>

<div class="card">

<div class="top">

<div>

<div class="title">
ANU PANEL
</div>

<div class="sub">
Created By Tamim
</div>

</div>

<div class="badge">
🖥️ TAMIM ANU 🇧🇩
</div>

</div>

<div class="panel">

<!-- RANGE -->

<div class="servicesWrap">

<div class="services"
id="services"></div>

</div>

<!-- INFO -->

<div class="info">

<div class="box">

<div class="label">
RANGE TOTAL NUMBER 
</div>

<div class="value"
id="rangeTotal">
0
</div>

</div>

<div class="box">

<div class="label">
PANEL TOTAL NUMBER
</div>

<div class="value"
id="panelTotal">
0
</div>

</div>

</div>

<!-- GET -->

<button class="getBtn"
id="getBtn">

╰┈➤📲 GET NUMBER 💻✌︎㋡

</button>

<!-- LIVE -->

<div class="live"
id="live"></div>

<!-- OTP -->

<button class="otpBtn"
onclick="window.open('https://anu-panel-1.onrender.com','_blank')">

🌍🚨 GET CODE 👁️📊

</button>

<!-- HISTORY -->

<div class="historyTitle">

🕹️ NUMBER HISTORY 🔢

</div>

<div class="history"
id="history"></div>

</div>

</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbxs5UnBzGbXDsbX_I027WP7RVdGrKBuKZpYGGPEee3l6lkr670YDne_A-cwdznjFeWMhg/exec";

const HISTORY_KEY="tamim_history";

const SLOT_KEY="tamim_live_slots";

const SERVICES=[

"rangeid01",
"rangeid02",
"rangeid03",
"rangeid04",
"rangeid05",

"rangeid06",
"rangeid07",
"rangeid08",
"rangeid09",
"rangeid10"

];

const servicesEl=
document.getElementById("services");

const rangeTotalEl=
document.getElementById("rangeTotal");

const panelTotalEl=
document.getElementById("panelTotal");

const liveEl=
document.getElementById("live");

const historyEl=
document.getElementById("history");

const toast=
document.getElementById("toast");

let slots=[

{num:"",active:false},
{num:"",active:false},
{num:"",active:false}

];

/* TOAST */

function showToast(t){

toast.textContent=t;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},3000);

}

/* SERVICE */

function getService(){

return localStorage
.getItem("service")
|| "rangeid01";

}

function setService(v){

localStorage
.setItem("service",v);

document
.querySelectorAll(".service")
.forEach(s=>{

s.classList.remove(
"active"
);

});

const btn=document.querySelector(

`[data-service="${v}"]`

);

if(btn){

btn.classList.add(
"active"
);

}

}

/* SAVE */

function saveSlots(){

localStorage.setItem(

SLOT_KEY,

JSON.stringify(slots)

);

}

/* LOAD */

function loadSlots(){

const saved=
localStorage.getItem(SLOT_KEY);

if(saved){

slots=JSON.parse(saved);

}

}

/* RENDER SERVICES */

function renderServices(){

servicesEl.innerHTML="";

SERVICES.forEach((s,i)=>{

servicesEl.innerHTML+=`

<div
class="service"
data-service="${s}">

Range ID ${(i+1)
.toString()
.padStart(2,"0")}

</div>

`;

});

document
.querySelectorAll(".service")
.forEach(btn=>{

btn.onclick=()=>{

setService(
btn.dataset.service
);

loadTotals();

updateServiceLights();

};

});

setService(
getService()
);

}

/* LIGHTS */

async function updateServiceLights(){

SERVICES.forEach(async s=>{

try{

const r=await fetch(

URL+
"?action=total&service="+s,

{cache:"no-store"}

);

const d=await r.json();

const btn=document.querySelector(

`[data-service="${s}"]`

);

if(!btn) return;

btn.classList.remove(
"hasNumbers"
);

/* ONLY GREEN IF NOT ACTIVE */

if(
Number(d.total)>0 &&
s!==getService()
){

btn.classList.add(
"hasNumbers"
);

}

}catch{}

});

}

/* BOXES */

function renderBoxes(){

liveEl.innerHTML="";

slots.forEach((slot,index)=>{

liveEl.innerHTML+=`

<div class="nbox">

<div class="num">

${slot.num}

</div>

${slot.active ? `

<button
class="copyBtn"
onclick="copySlot(${index})">

Copy

</button>

` : ``}

</div>

`;

});

}

/* TOTALS */

async function loadTotals(){

try{

const [r1,r2]=await Promise.all([

fetch(

URL+
"?action=total&service="+
getService(),

{cache:"no-store"}

),

fetch(

URL+
"?action=alltotal",

{cache:"no-store"}

)

]);

const d1=await r1.json();

const d2=await r2.json();

rangeTotalEl.textContent=
d1.total || 0;

panelTotalEl.textContent=
d2.total || 0;

}catch{}

}

/* GET */

async function getNumbers(){

let emptySlots=
slots.filter(
s=>!s.active
).length;

if(emptySlots===0){

showToast("সরি বস, মাপ করবেন🙏 আগে নিচের নাম্বার শেষ করুন ✅ ৩ টা থাকতে এখন নাম্বার দিলে তামীম স্যার আমাকে বকা দিবে,আর সাথে পিটানি Free 🙂🥹 ");

return;

}

try{

const r=await fetch(

URL+
"?action=get"+
"&service="+
getService()+
"&need="+
emptySlots,

{cache:"no-store"}

);

const d=await r.json();

const nums=d.numbers || [];

if(nums.length===0){

showToast("No Number");

return;

}

nums.forEach(num=>{

let slot=
slots.find(
s=>!s.active
);

if(slot){

slot.num=num;

slot.active=true;

}

});

saveSlots();

renderBoxes();

loadTotals();

updateServiceLights();

}catch{

showToast("Error");

}

}

/* HISTORY */

function loadHistory(){

return JSON.parse(

localStorage
.getItem(HISTORY_KEY)
|| "[]"

);

}

function saveHistory(arr){

localStorage.setItem(

HISTORY_KEY,

JSON.stringify(
arr.slice(0,5)
)

);

}

function addHistory(num){

let h=loadHistory();

h.unshift({

number:num,

range:getService()

});

saveHistory(h);

renderHistory();

}

function renderHistory(){

const h=loadHistory();

historyEl.innerHTML="";

for(let i=0;i<5;i++){

const item=h[i];

if(item){

historyEl.innerHTML+=`

<div class="hbox">

<div class="hnum">
${item.number}
</div>

<div class="hrange">
${item.range.toUpperCase()}
</div>

</div>

`;

}else{

historyEl.innerHTML+=`

<div class="hbox">

<div class="hnum"></div>

<div class="hrange"></div>

</div>

`;

}

}

}

/* COPY */

async function copySlot(index){

const slot=slots[index];

if(!slot.num) return;

try{

await navigator
.clipboard
.writeText(slot.num);

}catch{}

addHistory(slot.num);

slots[index]={

num:"",
active:false

};

saveSlots();

renderBoxes();

loadTotals();

updateServiceLights();

showToast("Copied");

}

/* INIT */

loadSlots();

renderBoxes();

renderHistory();

renderServices();

loadTotals();

updateServiceLights();

document
.getElementById("getBtn")
.onclick=getNumbers;

</script>

</body>
</html>
